[package]
name = "focus-timer"
version = "0.1.0"
description = "常驻 macOS 菜单栏的专注计时器"
edition = "2021"
rust-version = "1.77"

[lib]
name = "focus_timer_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# 默认启用，供 `tauri dev` 使用
custom-protocol = ["tauri/custom-protocol"]
