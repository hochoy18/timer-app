[package]
name = "focus-timer"
version = "0.1.0"
description = "常驻 macOS 菜单栏的专注计时器"
edition = "2021"
rust-version = "1.77"

[lib]
name = "focus_timer_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `image-png` 是运行时把 `icons/tray*.png` 解成 `Image` 用的（托盘图标要在
# 常态 / 提醒态之间切，两张都得带进二进制）。
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# 默认启用，供 `tauri dev` 使用
custom-protocol = ["tauri/custom-protocol"]
