[package]
name = "focus-timer"
version = "0.1.0"
description = "常驻 macOS 菜单栏的专注计时器"
edition = "2021"
# 单实例插件（`tauri-plugin-single-instance` 2.5）自己声明的最低 rust 版本就是
# 1.90（它还用了 2024 edition，那条线是 1.85——但插件把这条线抬到了 1.90）。
# 依赖的下限比自己高，本 crate 的下限也得跟着抬。
rust-version = "1.90"

[lib]
name = "focus_timer_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `image-png` 是运行时把 `icons/tray*.png` 解成 `Image` 用的（托盘图标要在
# 常态 / 提醒态之间切，两张都得带进二进制）。
#
# `macos-private-api` 是 `tauri.conf.json` 里 `macOSPrivateApi: true` 的对应开关：
# 少了它，tauri-build 会直接报错——配置里开了的开关，依赖特性得对上。
# （Tauri 2.12.1 起这组 API 已经默认开放，这个开关实质上是空转，但留着它
#   语义更清楚：面板要的是透明背景。）
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-notification = "2"
# 单实例：重复双击 `.app` 时，第二个进程把参数交给第一个然后自己退出。
# 它必须**第一个**注册进 builder——见 `src/single_instance.rs`。
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# `tauri::test` 那套假运行时：给 IPC 层的测试用（面板按钮 → 状态机 → 推给前端
# 的快照）。只在测试构建里打开，正式二进制不带上它。
tauri = { version = "2", features = ["test"] }

[features]
# 默认启用，供 `tauri dev` 使用
custom-protocol = ["tauri/custom-protocol"]
